{% extends "base.html" %}

{% block content %}

<section class="cards">

<div class="card">
    <div class="card-title">Agents</div>

    <div class="card-value">
        {{ total_agents }}
    </div>

    <div class="card-info">
        cadastrados
    </div>
</div>


<div class="card">
    <div class="card-title">Agents Online</div>

    <div class="card-value">
        {{ agents_online }}
    </div>

    <div class="card-info">
        disponíveis
    </div>
</div>


<div class="card">
    <div class="card-title">Robôs</div>

    <div class="card-value">
        {{ total_robots }}
    </div>

    <div class="card-info">
        cadastrados
    </div>
</div>


<div class="card">
    <div class="card-title">Execuções</div>

    <div class="card-value">
        0
    </div>

    <div class="card-info">
        em execução
    </div>
</div>

</section>


</section>



<script>





// ============================================================
// CARREGA EXECUÇÕES
// ============================================================

async function carregarExecucoes() {

    try {

        const response = await fetch(
            "/executions"
        );

        const data = await response.json();


        if (
            !response.ok ||
            data.status !== "success"
        ) {

            console.error(
                "Erro ao consultar execuções:",
                data
            );

            return;
        }


        const executionList =
            document.getElementById(
                "execution-list"
            );


        executionList.innerHTML = "";


        // ====================================================
        // NENHUMA EXECUÇÃO
        // ====================================================

        if (data.executions.length === 0) {

            executionList.innerHTML = `

                <tr>

                    <td colspan="7">

                        <div class="empty-state">

                            <div class="empty-icon">
                                ▶️
                            </div>

                            <h3>
                                Nenhuma execução
                            </h3>

                            <p>
                                Nenhum robô foi executado ainda.
                            </p>

                        </div>

                    </td>

                </tr>

            `;

            return;
        }


        // ====================================================
        // LISTA EXECUÇÕES
        // ====================================================

        data.executions.forEach(execution => {

            const row =
                document.createElement("tr");


            let statusHtml;


            if (execution.status === "success") {

                statusHtml = `
                    <span class="status-online">
                        ● Sucesso
                    </span>
                `;

            }

            else if (execution.status === "error") {

                statusHtml = `
                    <span class="status-offline">
                        ● Erro
                    </span>
                `;

            }

            else {

                statusHtml = `
                    <span>
                        ● Executando
                    </span>
                `;

            }


            const inicio =
                formatarData(
                    execution.started_at
                );


            const fim =
                formatarData(
                    execution.finished_at
                );


            row.innerHTML = `

                <td>
                    ${execution.id}
                </td>

                <td>
                    Robot #${execution.robot_id}
                </td>

                <td>
                    ${execution.agent_id}
                </td>

                <td>
                    ${inicio}
                </td>

                <td>
                    ${fim}
                </td>

                <td>
                    ${statusHtml}
                </td>

                <td>
                    ${
                        execution.error_message
                        || "-"
                    }
                </td>

            `;


            executionList.appendChild(
                row
            );

        });

    }

    catch (error) {

        console.error(
            "Erro ao carregar execuções:",
            error
        );

    }

}


// ============================================================
// FORMATA DATA
// ============================================================

function formatarData(
    data
) {

    if (!data) {

        return "-";

    }


    const dataObj =
        new Date(data);


    return dataObj.toLocaleString(
        "pt-BR"
    );

}


// ============================================================
// CARREGA AO ABRIR DASHBOARD
// ============================================================

carregarExecucoes();

</script>

{% endblock %}
