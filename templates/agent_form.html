{% extends "base.html" %}

{% block content %}

<section class="panel">

    <div class="panel-header">

        <div>
            <h2>Novo Agent</h2>

            <p>
                Cadastre um Agent no RPA Control Room
            </p>
        </div>

    </div>


    <form id="agentForm" class="form">

        <div class="form-group">

            <label for="host">
                Host
            </label>

            <input
                type="text"
                id="host"
                name="host"
                placeholder="Ex: 192.168.0.10"
                required
            >

        </div>


        <div class="form-group">

            <label for="port">
                Porta
            </label>

            <input
                type="number"
                id="port"
                name="port"
                placeholder="Ex: 8001"
                min="1"
                max="65535"
                required
            >

        </div>


        <div id="mensagem" class="form-message"></div>


        <div class="form-actions">

            <button
                type="button"
                class="btn-secondary"
                onclick="voltarDashboard()"
            >
                Cancelar
            </button>


            <button
                type="submit"
                class="btn-primary"
            >
                Cadastrar Agent
            </button>

        </div>

    </form>

</section>


<script>

document
    .getElementById("agentForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const host = document
            .getElementById("host")
            .value
            .trim();

        const port = parseInt(
            document.getElementById("port").value
        );

        const mensagem = document
            .getElementById("mensagem");


        mensagem.innerHTML = "Validando Agent...";


        try {

            const response = await fetch(
                "/agents/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        host: host,
                        port: port
                    })
                }
            );


            const resultado = await response.json();


            if (resultado.status === "success") {

                mensagem.innerHTML =
                    "Agent cadastrado com sucesso!";


                setTimeout(
                    function() {

                        window.location.href = "/";

                    },
                    1000
                );

                return;
            }


            mensagem.innerHTML =
                resultado.message ||
                "Não foi possível cadastrar o Agent.";

        }
        catch (error) {

            mensagem.innerHTML =
                "Erro ao comunicar com o Control Room.";

            console.error(error);

        }

    });


function voltarDashboard() {

    window.location.href = "/";

}

</script>

{% endblock %}
