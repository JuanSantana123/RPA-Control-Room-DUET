<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RPA Control Room</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

</head>

<body>

    <div class="layout">

        <aside class="sidebar">

            <div class="logo">

                <div class="logo-main">
                    RPA
                </div>

                <div class="logo-subtitle">
                    CONTROL ROOM
                </div>

            </div>


            <nav class="sidebar-nav">

                <a
                    href="/"
                    class="nav-item"
                >

                    <span class="nav-icon">
                        🏠
                    </span>

                    <span>
                        Dashboard
                    </span>

                </a>


                <a
                    href="/agents-page"
                    class="nav-item"
                >

                    <span class="nav-icon">
                        🖥️
                    </span>

                    <span>
                        Agents
                    </span>

                </a>


                <a
                    href="/robots"
                    class="nav-item active"
                >

                    <span class="nav-icon">
                        🤖
                    </span>

                    <span>
                        Robôs
                    </span>

                </a>


                <a
                    href="/executions/page"
                    class="nav-item"
                >
                    <span class="nav-icon">
                        ▶️
                    </span>

                    <span>
                        Execuções
                    </span>

                </a>


                <a
                    href="/history"
                    class="nav-item"
                >

                    <span class="nav-icon">
                        🕘
                    </span>

                    <span>
                        Histórico
                    </span>

                </a>

                <a
                    href="/schedules"
                    class="nav-item"
                >

                    <span class="nav-icon">
                        📅
                    </span>

                    <span>
                        Agendamentos
                    </span>

                </a>
                
                
                


                <a
                    href="#"
                    class="nav-item"
                >

                    <span class="nav-icon">
                        📋
                    </span>

                    <span>
                        Logs
                    </span>

                </a>

            </nav>


            <div class="sidebar-footer">

                <div class="system-indicator">

                    <span class="status-dot"></span>

                    <div>

                        <strong>
                            Sistema Online
                        </strong>

                        <small>
                            Control Room
                        </small>

                    </div>

                </div>

            </div>

        </aside>


        <main class="content">

            {% block content %}

            {% endblock %}

        </main>

    </div>

</body>

</html>
