name: Segurança

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: Análise estática
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript,python

      - name: Analisar código
        uses: github/codeql-action/analyze@v3

  dependencies:
    name: Revisão de dependências
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Bloquear novas vulnerabilidades altas
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

